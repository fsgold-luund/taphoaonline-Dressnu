<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chi tiết sản phẩm — TẠP HÓA - ONLINE</title>
<style>
  :root{
    --black:#0e0e0e;
    --white:#ffffff;
    --cream:#f4f1ec;
    --gray:#8a8a8a;
    --line:#e4e1da;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{
    font-family:'Helvetica Neue',Arial,'Segoe UI',sans-serif;
    color:var(--black);background:var(--white);-webkit-font-smoothing:antialiased;
  }
  a{text-decoration:none;color:inherit;}
  img{max-width:100%;display:block;}
  .wrap{max-width:1280px;margin:0 auto;padding:0 32px;}

  .ph{
    display:flex;align-items:center;justify-content:center;
    background:linear-gradient(135deg,#efece5,#e3ded3);
    color:#a49c8c;font-size:13px;letter-spacing:.05em;text-align:center;
    width:100%;height:100%;
  }

  header{
    position:sticky;top:0;z-index:50;background:rgba(255,255,255,.92);
    backdrop-filter:blur(6px);border-bottom:1px solid var(--line);
  }
  .nav{display:flex;align-items:center;justify-content:space-between;height:80px;}
  .logo{font-size:22px;font-weight:700;letter-spacing:.1em;}
  .back-link{font-size:13px;letter-spacing:.05em;text-transform:uppercase;color:var(--gray);}
  .back-link:hover{color:var(--black);}

  .breadcrumb{padding:24px 0 0;font-size:12px;color:var(--gray);letter-spacing:.02em;}
  .breadcrumb a:hover{color:var(--black);}

  .detail{padding:24px 0 100px;}
  .detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:56px;align-items:flex-start;}
  .gallery-main{aspect-ratio:3/4;overflow:hidden;background:var(--cream);margin-bottom:14px;}
  .gallery-main img{width:100%;height:100%;object-fit:cover;}
  .gallery-thumbs{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;}
  .gallery-thumbs button{
    padding:0;border:1px solid var(--line);background:none;cursor:pointer;
    aspect-ratio:3/4;overflow:hidden;
  }
  .gallery-thumbs button.active{border-color:var(--black);}
  .gallery-thumbs img{width:100%;height:100%;object-fit:cover;}

  .info{position:sticky;top:100px;}
  .info .eyebrow{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--gray);margin-bottom:12px;}
  .info h1{font-size:clamp(24px,3vw,34px);font-weight:700;line-height:1.3;letter-spacing:-.01em;margin-bottom:18px;}
  .info .badge{display:inline-block;margin-bottom:16px;background:var(--black);color:var(--white);font-size:11px;letter-spacing:.05em;text-transform:uppercase;padding:5px 10px;}
  .info p.note{font-size:14px;color:var(--gray);line-height:1.7;margin:18px 0 28px;max-width:420px;}
  .btn-buy{
    display:inline-flex;align-items:center;gap:10px;
    padding:16px 34px;font-size:13px;letter-spacing:.08em;text-transform:uppercase;
    background:var(--black);color:var(--white);border:1px solid var(--black);cursor:pointer;transition:.2s;
  }
  .btn-buy:hover{background:#333;}
  .btn-back-home{
    display:inline-block;margin-top:16px;font-size:12px;letter-spacing:.06em;text-transform:uppercase;
    color:var(--gray);border-bottom:1px solid var(--line);padding-bottom:2px;
  }
  .btn-back-home:hover{color:var(--black);border-color:var(--black);}

  .not-found{padding:120px 32px;text-align:center;}
  .not-found h1{font-size:24px;margin-bottom:16px;}

  @media (max-width:820px){
    .detail-grid{grid-template-columns:1fr;gap:28px;}
    .info{position:static;}
  }

  footer{background:var(--black);color:#a7a7a7;padding:28px 0;font-size:12px;text-align:center;}
</style>
</head>
<body>

<header>
  <div class="wrap nav">
    <a href="landing-page-quan-ao-nam.html" class="logo">TẠP HÓA - ONLINE</a>
    <a href="landing-page-quan-ao-nam.html#san-pham" class="back-link">← Quay lại sản phẩm</a>
  </div>
</header>

<div id="app"></div>

<footer>© 2026 Tạp Hóa - Online. All rights reserved.</footer>

<script src="products-data.js"></script>
<script>
const params = new URLSearchParams(location.search);
const id = Number(params.get('id'));
const product = PRODUCTS.find(p => p.id === id);
const app = document.getElementById('app');

if (!product) {
  app.innerHTML = `
    <div class="not-found">
      <h1>Không tìm thấy sản phẩm</h1>
      <a class="btn-back-home" href="landing-page-quan-ao-nam.html">← Về trang chủ</a>
    </div>`;
} else {
  document.title = product.name + " — TẠP HÓA - ONLINE";

  const imgHtml = (filename, alt) => `
    <img src="${product.folder}/${filename}" alt="${alt}"
         onerror="this.replaceWith(Object.assign(document.createElement('div'),{className:'ph',style:'width:100%;height:100%',innerText:'${filename}'}))">`;

  app.innerHTML = `
    <div class="wrap breadcrumb">
      <a href="landing-page-quan-ao-nam.html">Trang chủ</a> ·
      <a href="landing-page-quan-ao-nam.html#san-pham">Sản phẩm</a> ·
      ${product.name}
    </div>
    <div class="wrap detail">
      <div class="detail-grid">
        <div>
          <div class="gallery-main" id="gallery-main">${imgHtml(product.images[0], product.name)}</div>
          <div class="gallery-thumbs" id="gallery-thumbs">
            ${product.images.map((img, i) => `
              <button data-index="${i}" class="${i === 0 ? 'active' : ''}">${imgHtml(img, product.name + ' ' + (i + 1))}</button>
            `).join('')}
          </div>
        </div>
        <div class="info">
          ${product.badge ? `<span class="badge">${product.badge}</span>` : ""}
          <div class="eyebrow">Tạp Hóa - Online</div>
          <h1>${product.fullName}</h1>
          <p class="note">Sản phẩm được đặt mua trực tiếp qua gian hàng Shopee chính thức. Bấm "Mua sản phẩm" để xem giá, chọn size/màu và đặt hàng.</p>
          <a class="btn-buy" href="${product.buyLink}" target="_blank" rel="noopener noreferrer">Mua sản phẩm →</a>
          <div><a class="btn-back-home" href="landing-page-quan-ao-nam.html#san-pham">← Xem thêm sản phẩm khác</a></div>
        </div>
      </div>
    </div>`;

  document.getElementById('gallery-thumbs').addEventListener('click', (e) => {
    const btn = e.target.closest('button[data-index]');
    if (!btn) return;
    const i = Number(btn.dataset.index);
    document.getElementById('gallery-main').innerHTML = imgHtml(product.images[i], product.name);
    document.querySelectorAll('#gallery-thumbs button').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
  });
}
</script>
</body>
</html>
